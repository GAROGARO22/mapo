<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAPZI | الخارطة</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<link rel="preconnect" href="https://unpkg.com"><link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--panel:#121821e6;--line:#22303f;--tx:#e8eef5;--mut:#8aa0b4;--acc:#38bdf8;--gold:#f5c542}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#top{position:fixed;inset-block-start:0;inset-inline:0;z-index:1000;display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:linear-gradient(180deg,#0b0f14f2,#0b0f14d9 70%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:.5px}
.logo b{background:linear-gradient(135deg,var(--acc),#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite}
.dot.off{background:#ef4444;box-shadow:0 0 8px #ef4444;animation:none}
@keyframes pulse{50%{opacity:.4}}
.stat{font-size:12px;color:var(--mut)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;padding:7px 13px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);transition:.2s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on{background:var(--acc);color:#04121e;border-color:var(--acc)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold.on{background:var(--gold);color:#1d1500}
#timebar{position:fixed;inset-block-end:0;inset-inline:0;z-index:1000;display:none;align-items:center;justify-content:center;gap:8px;
  padding:10px;background:linear-gradient(0deg,#0b0f14f2,#0b0f14cc 75%,transparent)}
#timebar.show{display:flex}
#daylabel{font-size:13px;font-weight:700;color:var(--gold);min-width:110px;text-align:center}
select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13px}
#layers{position:fixed;inset-block-start:62px;inset-inline-start:12px;z-index:900;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(10px);max-height:60vh;overflow:auto;width:min(260px,70vw)}
#layers h4{font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:700}
.layrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 2px;cursor:pointer}
.layrow input{accent-color:var(--acc)}
.swatch{width:10px;height:10px;border-radius:50%;flex:none}
.layrow .cnt{margin-inline-start:auto;color:var(--mut);font-size:11px}
#map{position:fixed;inset:0;background:#0b0f14}
.leaflet-container{background:#0b0f14;font-family:Cairo,Tahoma,sans-serif}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--tx)!important;border-color:var(--line)!important}
.pin{border-radius:50%;border:2px solid #0b0f1480;box-shadow:0 0 0 1px #ffffff26,0 1px 4px #0009;transition:transform .12s}
.pin:hover{transform:scale(1.6);z-index:9999}
.mk-label{white-space:nowrap;font-size:10px;font-weight:700;color:#dbe7f2;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none}
.tip{background:#121821f0!important;border:1px solid var(--line)!important;color:var(--tx)!important;border-radius:10px!important;
  box-shadow:0 8px 30px #000a;font-family:Cairo!important}
.tip b{color:var(--acc)} .tip small{color:var(--mut)}
#search{position:fixed;inset-block-start:62px;inset-inline-end:12px;z-index:900;display:none;flex-direction:column;gap:6px;width:min(300px,80vw)}
#search.show{display:flex}
#search input{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;outline:none}
#results{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:38vh;overflow:auto;backdrop-filter:blur(10px)}
.res{padding:8px 12px;font-size:12.5px;cursor:pointer;border-block-end:1px solid #1a2432}
.res:hover{background:#1a2836}.res small{color:var(--mut)}
#toast{position:fixed;inset-block-start:64px;left:50%;transform:translateX(-50%);z-index:1200;background:var(--panel);
  border:1px solid var(--line);padding:8px 16px;border-radius:12px;font-size:13px;display:none;backdrop-filter:blur(8px)}
#lock{position:fixed;inset:0;z-index:2000;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px}
#lock .big{font-size:64px;font-weight:900;color:#1c2836}
@media(max-width:640px){#layers{max-height:42vh;font-size:11px}.stat{display:none}}
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" ondragstart="return false" onselectstart="return false">
<div id="top">
  <div class="logo">🗺️ <b>MAPZI</b></div>
  <span class="dot" id="statusdot"></span>
  <span class="stat" id="statustxt">جارٍ التحميل…</span>
  <div class="spacer"></div>
  <button class="btn" id="bSearch">🔍 بحث</button>
  <button class="btn" id="bLabels">A− التسميات</button>
  <button class="btn" id="bLayers">☰ الطبقات</button>
  <button class="btn gold" id="bTime">⏳ آلة الزمن</button>
  <button class="btn" id="bReload">⟳ تحديث</button>
</div>

<div id="map"></div>

<div id="layers" hidden><h4>الطبقات</h4><div id="laylist"></div></div>

<div id="search">
  <input id="q" placeholder="ابحث عن موقع أو حدث…" autocomplete="off">
  <div id="results"></div>
</div>

<div id="timebar">
  <button class="btn" id="tOlder">⏮ الأقدم</button>
  <select id="daysel"></select>
  <span id="daylabel">—</span>
  <button class="btn" id="tNewer">الأحدث ⏭</button>
  <button class="btn on" id="tLive">اليوم ● LIVE</button>
</div>

<div id="toast"></div>
<div id="lock"><div><div class="big">404</div><p style="color:var(--mut)">هذه الصفحة غير متاحة هنا.</p></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
/* ============ MAPZI — standalone viewer (no google maps embed) ============ */
const MID='1NZygQ5FhCvHG3ZH6Ddk3lbzAwnJum8M';
const DATA_API='/api/mapdata';           // live snapshot (server pulls KML hourly cron + on demand)
const HISTORY_RAW='https://raw.githubusercontent.com/GAROGARO22/mapzi-archive/main/history.json';
const POLL_MS=5*60*1000;                 // frontend re-check every 5 min (cron refreshes server-side)
let map,layerGroup,labelLayer,tiles;
let DATA=null,layerOn={},showLabels=false,liveSig='',viewDay=null,histDays=[];

/* ---------- map init ---------- */
map=L.map('map',{zoomControl:true,attributionControl:false,minZoom:3,maxZoom:17,
  doubleZoomWheel:false,zoomSnap:.25,wheelPxPerZoomLevel:90}).setView([15.7,46.9],6);
tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:.55}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{opacity:.9}).addTo(map);
layerGroup=L.layerGroup().addTo(map);
labelLayer=L.layerGroup();

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').style.display='none',2600);}
function setStatus(ok,t){$('statusdot').className='dot'+(ok?'':' off');$('statustxt').textContent=t;}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- render points ---------- */
function pinIcon(c,size){const d=document.createElement('div');d.className='pin';d.style.cssText=`width:${size}px;height:${size}px;background:${c}`;
  return L.divIcon({html:d.outerHTML,iconSize:[size,size],iconAnchor:[size/2,size/2],className:''});}
function render(pts){
  layerGroup.clearLayers();labelLayer.clearLayers();
  const zoom=map.getZoom();
  const size=zoom>=9?12:zoom>=7?10:8;
  for(const p of pts){
    if(!layerOn[p.l])continue;
    const m=L.circleMarker([p.la,p.lo],{radius:size/2+1,color:'#0b0f14',weight:1,fillColor:p.c||'#cfd8dc',fillOpacity:.95})
      .bindTooltip(`<b>${esc(p.n)}</b><br><small>${esc(p.l)}</small>${p.d?`<br><small>${esc(p.d.slice(0,140))}</small>`:''}`,
        {className:'tip',direction:'top',offset:[0,-8]});
    m.addTo(layerGroup);
    if(showLabels&&(zoom>=8||pts.length<300)){
      L.marker([p.la,p.lo],{icon:L.divIcon({html:`<div class="mk-label">${esc((p.n||'').slice(0,24))}</div>`,
        className:'',iconSize:[0,0],iconAnchor:[-6,8]}),interactive:false}).addTo(labelLayer);
    }
  }
  if(showLabels&&!map.hasLayer(labelLayer))labelLayer.addTo(map);
  if(!showLabels&&map.hasLayer(labelLayer))map.removeLayer(labelLayer);
  $('statustxt').textContent=`${pts.length} موقعاً · ${new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})}`;
}
function buildLayers(){
  const list=$('laylist');list.innerHTML='';
  const counts={};for(const p of DATA.points)counts[p.l]=(counts[p.l]||0)+1;
  for(const l of DATA.layers){
    if(!(l in layerOn))layerOn[l]=true;
    const row=document.createElement('label');row.className='layrow';
    const col=(DATA.points.find(p=>p.l===l)||{}).c||'#cfd8dc';
    row.innerHTML=`<input type="checkbox" ${layerOn[l]?'checked':''}><span class="swatch" style="background:${col}"></span><span>${esc(l)}</span><span class="cnt">${counts[l]||0}</span>`;
    row.querySelector('input').addEventListener('change',e=>{layerOn[l]=e.target.checked;render(DATA.points);});
    list.appendChild(row);
  }
}


/* ---------- date tags for time machine ---------- */
const MON={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',sept:'09',oct:'10',nov:'11',dec:'12'};
function tagDates(d){for(const p of (d.points||[])){if(p.dt)continue;const m=(p.n+' '+(p.d||'')).match(/\[?\s*(\d{1,2})\s*([A-Za-z]{3,4})/);if(m){const mo=MON[m[2].toLowerCase().slice(0,4)]||MON[m[2].toLowerCase().slice(0,3)];if(mo)p.dt=(m[1]>20?'2026-':'2026-')+mo+'-'+String(m[1]).padStart(2,'0');}}}

/* ---------- data loading ---------- */
async function loadLive(refresh){
  try{
    const r=await fetch(DATA_API+'?action=get&cb='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();
    if(d&&d.points&&d.points.length){
      DATA=d;liveSig=d.sig||'';tagDates(DATA);
      if(!viewDay){buildLayers();render(DATA.points);}
      setStatus(true,'مباشر ✓');
      if(refresh)toast('تم تحديث البيانات');
      return true;
    }
    throw 0;
  }catch{
    setStatus(false,'تعذّر جلب البيانات — إعادة المحاولة…');
    if(refresh)toast('فشل التحديث، سيُعاد المحاولة تلقائياً');
    return false;
  }
}
async function triggerRefresh(){ // ask server to pull fresh KML from original map
  try{await fetch(DATA_API+'?action=refresh',{method:'POST'});}catch{}
}

/* ---------- time machine ---------- */
async function loadHistory(){
  let h=null;
  try{const r=await fetch(HISTORY_RAW+'?cb='+Date.now(),{cache:'no-store'});if(r.ok)h=await r.json();}catch{}
  if(!h){try{const r=await fetch('/data/history.json',{cache:'force-cache'});if(r.ok)h=await r.json();}catch{}}
  if(h){
    histDays=Object.keys(h).sort();
    const sel=$('daysel');sel.innerHTML='';
    for(const d of histDays){const o=document.createElement('option');o.value=d;o.textContent=d+(d===today()?' (اليوم)':'');sel.appendChild(o);}
  }
}
function today(){return new Date().toISOString().slice(0,10);}
function showDay(day){
  viewDay=day;
  $('daylabel').textContent=day==='live'?'':day;
  $('tLive').classList.toggle('on',day==='live');
  if(day==='live'){render(DATA.points||[]);setStatus(true,'مباشر ✓');return;}
  // historical: filter points by date tags found in names/descriptions ([dd MMM] patterns) & archive day count
  const pts=(DATA.points||[]).filter(p=>!p.dt||p.dt<=day);
  render(pts);setStatus(true,'عرض تاريخي: '+day);
}
$('bTime').addEventListener('click',()=>{
  const tb=$('timebar');tb.classList.toggle('show');
  $('bTime').classList.toggle('on');
  if(tb.classList.contains('show')&&!histDays.length)loadHistory();
});
$('tLive').addEventListener('click',()=>showDay('live'));
$('daysel').addEventListener('change',e=>showDay(e.target.value));
$('tOlder').addEventListener('click',()=>{const i=histDays.indexOf(viewDay);showDay(histDays[Math.max(0,(i<0?histDays.length:i)-1)])});
$('tNewer').addEventListener('click',()=>{const i=histDays.indexOf(viewDay);if(i>=histDays.length-1)showDay('live');else showDay(histDays[i+1])});

/* ---------- UI toggles ---------- */
$('bLayers').addEventListener('click',()=>{$('layers').hidden=!$('layers').hidden;$('bLayers').classList.toggle('on');});
$('bLabels').addEventListener('click',()=>{showLabels=!showLabels;$('bLabels').classList.toggle('on');if(DATA)render(DATA.points);});
$('bSearch').addEventListener('click',()=>{$('search').classList.toggle('show');$('bSearch').classList.toggle('on');if($('search').classList.contains('show'))$('q').focus();});
$('q').addEventListener('input',e=>{
  const q=e.target.value.trim();const res=$('results');res.innerHTML='';
  if(q.length<2||!DATA)return;
  const hits=(viewDay&&viewDay!=='live'?DATA.points:DATA.points).filter(p=>(p.n+' '+p.l+' '+p.d).includes(q)).slice(0,40);
  for(const p of hits){const el=document.createElement('div');el.className='res';
    el.innerHTML=`<span class="swatch" style="background:${p.c};display:inline-block"></span> <b>${esc(p.n)}</b><br><small>${esc(p.l)} · ${p.la}, ${p.lo}</small>`;
    el.addEventListener('click',()=>{map.setView([p.la,p.lo],10);p._m&&p._m.openTooltip&&p._m.openTooltip();});
    res.appendChild(el);}
  if(!hits.length)res.innerHTML='<div class="res">لا نتائج</div>';
});
$('bReload').addEventListener('click',async()=>{toast('جارٍ سحب آخر نسخة من الخارطة الأصلية…');await triggerRefresh();await loadLive(true);await loadHistory();});
map.on('zoomend',()=>{if(DATA&&!viewDay)render(DATA.points);});

/* ---------- protection (view only) ---------- */
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='F12'||(e.ctrlKey&&['u','s','p','c','a'].includes(k))||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();location.href='/blocked';}
},{capture:true});
window.addEventListener('paste',e=>e.preventDefault());
const openW=window.open;window.open=function(u){u=String(u||'');if(/google|mymaps|maps\.app/.test(u))return null;return openW.apply(window,arguments);};
const iv=setInterval(()=>{if(innerWidth-outerWidth>170||innerHeight-outerHeight>170){$('lock').style.display='grid';}},1200);
try{Object.defineProperty(navigator,'clipboard',{get:()=>({writeText:()=>Promise.reject(),write:()=>Promise.reject()})});}catch{}
history.pushState(null,'',location.href);addEventListener('popstate',()=>history.pushState(null,'',location.href));

/* ---------- boot + polling ---------- */
(async function(){
  await loadLive(false);
  if(!DATA){ // bootstrap fallback bundled snapshot
    try{const r=await fetch('/data/mapdata.json',{cache:'force-cache'});DATA=await r.json();tagDates(DATA);liveSig=DATA.sig||'';buildLayers();render(DATA.points);setStatus(true,'نسخة محلية مبدئية');}catch{setStatus(false,'لا توجد بيانات');}
  }
  loadHistory();
  setInterval(async()=>{ // periodic check: compare sig with server snapshot
    try{const r=await fetch(DATA_API+'?action=get&cb='+Date.now(),{cache:'no-store'});if(!r.ok)return;
      const d=await r.json();
      if(d&&d.points&&d.sig&&d.sig!==liveSig){toast('🔄 تحديث جديد على الخارطة — جارٍ العرض');DATA=d;liveSig=d.sig;tagDates(DATA);buildLayers();if(!viewDay||viewDay==='live')render(DATA.points);}
    }catch{}
  },POLL_MS);
  setTimeout(triggerRefresh,8000); // keep server snapshot fresh for visitors
})();
</script>
</body>
</html>
