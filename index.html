<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الخارطة | Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0f172a; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    header {
      color: #e2e8f0;
      text-align: center;
      padding: 14px 10px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.3rem; font-weight: 600; }
    .map-wrap {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 12px;
    }
    .map-frame {
      position: relative;
      width: 100%;
      /* نسبة أبعاد الخارطة */
      padding-bottom: 62.5%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
      background: #1e293b;
    }
    .map-frame iframe {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    footer {
      color: #64748b;
      text-align: center;
      padding: 12px;
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🗺️ الخارطة التفاعلية</h1>
  </header>

  <div class="map-wrap">
    <div class="map-frame">
      <iframe src="https://www.google.com/maps/d/embed?mid=1NZygQ5FhCvHG3ZH6Ddk3lbzAwnJum8M&ehbc=2E312F" width="640" height="480" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <footer>Powered by Vercel</footer>
</body>
</html>
