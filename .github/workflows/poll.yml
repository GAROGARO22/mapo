name: Poll map & archive daily snapshots
on:
  schedule:
    - cron: '*/15 * * * *'      # <- requirement #1: pull every 15 minutes (change freely)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run worker
        env:
          MAPZI_PAT: ${{ secrets.MAPZI_PAT }}
        run: python worker.py
