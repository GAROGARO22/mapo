<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPZI - الخريطة التفاعلية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside id="panel">
        <h1>MAPZI</h1>
        <input id="search" type="search" placeholder="ابحث عن معلم أو طبقة..." autocomplete="off">
        <div class="btns">
            <button id="btn-fit" type="button">عرض الكل</button>
            <button id="btn-all" type="button">إظهار الجميع</button>
            <button id="btn-none" type="button">إخفاء الجميع</button>
        </div>
        <div id="layers"></div>
        <div id="status" class="status"></div>
    </aside>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/sanitize.js"></script>
    <script src="js/app.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/gmaps.js"></script>
</body>
</html>
